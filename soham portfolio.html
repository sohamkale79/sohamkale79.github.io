<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sohan Kale – Computer Science Student and Developer</title>
<meta name="description" content="Portfolio of Sohan Kale: full stack Java, JavaScript and AI projects, internships and certifications.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f5f9;--surface:#fff;--ink:#101a2e;--muted:#56627a;--line:#d9dfeb;--accent:#1f5fd1;--on-accent:#fff;--hero:#0f1a30;--hero-muted:#a9b6d0;--hero-accent:#7db4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0a1122;--surface:#131d36;--ink:#eef2fb;--muted:#9aa8c4;--line:#243152;--accent:#7db4ff;--on-accent:#0a1122;--hero:#0a1122;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1122;--surface:#131d36;--ink:#eef2fb;--muted:#9aa8c4;--line:#243152;--accent:#7db4ff;--on-accent:#0a1122;--hero:#0a1122;color-scheme:dark}
:root[data-theme="forest"]{--bg:#0d1a14;--surface:#12251c;--ink:#e9f5ee;--muted:#93b0a0;--line:#21402f;--accent:#5fd394;--on-accent:#07150e;--hero:#0a1610;--hero-muted:#a3c2b1;--hero-accent:#7ee6ad;--glow:#1f6b45;color-scheme:dark}
:root[data-theme="sunset"]{--bg:#1a0f14;--surface:#26151c;--ink:#fdeee8;--muted:#c9a79c;--line:#43232b;--accent:#ff9a5c;--on-accent:#1a0f14;--hero:#140a10;--hero-muted:#d4b0a4;--hero-accent:#ffb27a;--glow:#8a3a2a;color-scheme:dark}
:root[data-theme="violet"]{--bg:#120f24;--surface:#1c1836;--ink:#efeafd;--muted:#aaa3cf;--line:#302a5a;--accent:#b49bff;--on-accent:#120f24;--hero:#0e0b20;--hero-muted:#b6aedb;--hero-accent:#c9b8ff;--glow:#4a2f9a;color-scheme:dark}
:root[data-theme="rose"]{--bg:#fff3f6;--surface:#fff;--ink:#3a1020;--muted:#7a5563;--line:#f0cfd9;--accent:#c2255c;--on-accent:#fff;--hero:#4a0f28;--hero-muted:#e9b9cb;--hero-accent:#ff9ec0;--glow:#a0245a;color-scheme:light}
.tp{position:relative}.tm{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;min-width:150px;box-shadow:0 12px 30px #0006;z-index:40}
.tm button{display:flex;align-items:center;gap:10px;border:0;color:var(--ink);padding:9px 12px;text-align:left;width:100%}.tm button:hover,.tm button[aria-checked="true"]{background:var(--bg)}.tm button[aria-checked="true"]{box-shadow:inset 3px 0 0 var(--accent)}.tm i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:#fff;border-bottom:1px solid #ffffff1f}
.bar{max-width:1060px;margin:auto;padding:12px 22px;display:flex;align-items:center;gap:18px}
.logo{font:800 20px "Bricolage Grotesque",sans-serif;text-decoration:none;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;padding:6px 10px;border-radius:8px;font-size:15px;color:var(--hero-muted)}
nav a:hover,nav a.on{color:#fff;background:#ffffff1a}
button,.btn{font:600 15px "Instrument Sans",sans-serif;cursor:pointer;border-radius:10px;padding:11px 18px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);text-decoration:none;display:inline-block}
.btn.solid,button.solid{background:var(--accent);color:var(--on-accent)}
#theme{border-color:#ffffff40;color:#fff;padding:6px 11px}
.hero{background:radial-gradient(520px circle at var(--mx,70%) var(--my,30%),var(--glow,#2a4a8a) 0,transparent 70%),var(--hero);color:#fff;overflow:hidden}
.hero .in{max-width:1060px;margin:auto;padding:64px 22px 72px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(46px,8vw,92px);font-weight:800;letter-spacing:-.03em}
.role{font-size:clamp(20px,3vw,28px);color:var(--hero-accent);margin:18px 0 8px;font-weight:500;min-height:1.3em}
.hero p{color:var(--hero-muted);max-width:52ch;margin:0 0 26px}
.hero .btn{border-color:var(--hero-accent);color:var(--hero-accent);margin:0 8px 8px 0}
.hero .btn.solid{background:var(--hero-accent);color:#0a1122}
.pw{position:relative;width:min(100%,360px);justify-self:center}
.photo{width:100%;aspect-ratio:1;border-radius:50%;border:5px solid #fff;object-fit:cover;box-shadow:0 0 0 14px #ffffff14;display:block}
.fl{position:absolute;background:#fff;color:#0f1a30;font:700 14px "Instrument Sans",sans-serif;padding:7px 13px;border-radius:99px;animation:bob 4s ease-in-out infinite}
.fl:nth-child(2){top:4%;left:-8%}.fl:nth-child(3){top:18%;right:-10%;animation-delay:-1s}.fl:nth-child(4){bottom:14%;left:-12%;animation-delay:-2s}.fl:nth-child(5){bottom:2%;right:-4%;animation-delay:-3s}
@keyframes bob{50%{transform:translateY(-9px)}}
main{max-width:1060px;margin:auto;padding:0 22px}
.progress{position:absolute;left:0;top:0;height:3px;width:100%;background:var(--hero-accent);transform-origin:left;transform:scaleX(0)}
#menu{display:none;border-color:#ffffff40;color:#fff;padding:6px 11px}
.search{width:100%;max-width:420px;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #ffffff33;border-radius:99px;padding:5px 14px;font-size:14px;color:var(--hero-muted);margin-bottom:16px}
.pill i{width:8px;height:8px;border-radius:50%;background:#4ade80}
.card{transition:border-color .2s}.card:hover{border-color:var(--accent)}
section{padding:72px 0 8px}
h2{font-size:clamp(30px,4.5vw,44px);margin-bottom:10px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 28px;max-width:62ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{padding:7px 15px;border-color:var(--line);color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:1px solid var(--line);padding:8px 15px;border-radius:99px;font-weight:500}
.chip small{color:var(--muted);font-weight:400;margin-left:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.card h3{font-size:24px;margin-bottom:6px}
.meta{color:var(--muted);font-size:15px;margin:0 0 12px}
.tag{display:inline-block;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 9px;margin:0 6px 6px 0}
.console{display:grid;grid-template-columns:minmax(220px,.8fr) 1.6fr;gap:20px}
.plist{display:grid;gap:8px;align-content:start}
.plist button{text-align:left;padding:14px 16px;border-color:var(--line);color:var(--ink);background:var(--surface)}
.plist button small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.plist button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.panel h3{font-size:32px}.panel p{margin:0 0 14px}
.panel ul{padding-left:20px;margin:0 0 14px}
.tl{border-left:2px solid var(--line);padding-left:24px;display:grid;gap:22px}
.tl .card{position:relative}
.tl .card::before{content:"";position:absolute;left:-33px;top:30px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.stat{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px}
.stat b{display:block;font:800 30px "Bricolage Grotesque",sans-serif}
.stat span{color:var(--muted);font-size:14px}
.cert{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.cert:last-child{border:0}.cr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.vc{padding:6px 12px;font-size:14px;white-space:nowrap}.cert p{margin:0}
.score{font:700 18px "Bricolage Grotesque",sans-serif;color:var(--accent);white-space:nowrap}
form{display:grid;gap:14px;max-width:560px}
label{font-weight:600;font-size:15px;display:grid;gap:6px}
input,textarea{font:inherit;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px}
.note{color:var(--muted);font-size:15px;min-height:1.4em}
footer{max-width:1060px;margin:72px auto 0;padding:26px 22px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
@media (max-width:760px){body{font-size:16px}.hero .in{grid-template-columns:1fr;padding-top:40px;gap:30px}.pw{order:-1;width:min(66%,250px)}#menu{display:inline-block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--hero);flex-direction:column;padding:10px 22px 16px;border-bottom:1px solid #ffffff1f}nav.open{display:flex}nav a{padding:12px 10px}.console{grid-template-columns:1fr}.plist{display:flex;overflow-x:auto;padding-bottom:6px}.plist button{white-space:nowrap}.card{padding:18px}.panel h3{font-size:26px}.cert{flex-direction:column;gap:4px}.search{max-width:none}section{padding-top:56px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fl{animation:none}}
</style>
</head>

const [f,setF]=useState("All"),[sel,setSel]=useState(0),[q,setQ]=useState("");
const shown=PROJECTS.filter(p=>(f==="All"||p.k===f)&&(p.t+" "+p.tags.join(" ")+" "+p.d).toLowerCase().includes(q.toLowerCase()));
const p=shown[sel]||shown[0];
return html`<section id="projects"><h2>Projects</h2><p class="lead">Six projects across full stack, AI and web. Filter, search or choose one to see what it does.</p>
<${Tabs} names=${["All","Full Stack","AI","Web"]} value=${f} onChange=${v=>{setF(v);setSel(0)}}/>
<input class="search" type="search" placeholder="Search projects or tech, e.g. Java" aria-label="Search projects" value=${q} onInput=${e=>{setQ(e.target.value);setSel(0)}}/>
<div class="console"><div class="plist" role="tablist">${shown.map((x,i)=>html`<button key=${x.t} role="tab" aria-selected=${x===p} onClick=${()=>setSel(i)}>${x.t}<small>${x.k} project</small></button>`)}</div>
${!p?html`<div class="card panel"><p>No project matches your search. Try another word.</p></div>`:html`<div class="card panel" role="tabpanel"><h3>${p.t}</h3><p class="meta">${p.tags.map(t=>html`<span class="tag" key=${t}>${t}</span>`)}</p><p>${p.d}</p><ul>${p.b.map(b=>html`<li key=${b}>${b}</li>`)}</ul></div>`}</div></section>`}

function Certs(){
const [g,setG]=useState("All");
return html`<section id="certifications"><h2>Certifications</h2>
<${Tabs} names=${["All","IIT Bombay","NPTEL","Deloitte"]} value=${g} onChange=${setG}/>
<div class="card" style=${{padding:"8px 24px"}}>${CERTS.filter(c=>g==="All"||c.g===g).map(c=>html`<div class="cert" key=${c.n}><div><p><b>${c.n}</b></p><p class="meta" style=${{margin:"2px 0 0"}}>${[c.o,c.w].filter(Boolean).join(" · ")}</p></div><div class="cr">${c.sc&&html`<span class="score">${c.sc}</span>`}${c.l&&html`<a class="btn vc" href=${c.l} target="_blank" rel="noopener">View certificate</a>`}</div></div>`)}</div></section>`}

function Contact(){
const [f,setF]=useState({n:"",e:"",m:""}),[note,setNote]=useState(""),[cp,setCp]=useState("Copy email");
const set=k=>e=>setF({...f,[k]:e.target.value});
const copy=async()=>{try{await navigator.clipboard.writeText(EMAIL);setCp("Copied")}catch(e){setCp("Copy failed: select the address above")}setTimeout(()=>setCp("Copy email"),2000)};
const send=e=>{e.preventDefault();location.href=`mailto:${EMAIL}?subject=${encodeURIComponent("Portfolio message from "+f.n)}&body=${encodeURIComponent(f.m+"\n\nFrom: "+f.n+" ("+f.e+")")}`;setNote("Your email app should open. If it does not, copy the address above and send your message directly.")};
return html`<section id="contact"><h2>Contact</h2><p class="lead">Write a message below and it opens in your email app, ready to send.</p>
<div class="links"><a class="btn" href=${"mailto:"+EMAIL}>${EMAIL}</a><button type="button" onClick=${copy}>${cp}</button><a class="btn" href="tel:+917875908506">+91 78759 08506</a>
<a class="btn" href="https://www.linkedin.com/in/sohan-kale-883764248" target="_blank" rel="noopener">LinkedIn</a><a class="btn" href="https://github.com/sohamkale79" target="_blank" rel="noopener">GitHub</a></div>
<form onSubmit=${send}><label>Your name<input required autocomplete="name" value=${f.n} onInput=${set("n")}/></label>
<label>Your email<input type="email" required autocomplete="email" value=${f.e} onInput=${set("e")}/></label>
<label>Message<textarea rows="5" required value=${f.m} onInput=${set("m")}></textarea></label>
<button class="solid" type="submit">Open in email app</button><div class="note" role="status">${note}</div></form></section>`}

function App(){
const [act,setAct]=useState(""),[open,setOpen]=useState(false),[pg,setPg]=useState(0),[th,setTh]=useState(""),[tm,setTm]=useState(false);
useEffect(()=>{try{const s=localStorage.getItem("theme");if(s&&THEMES.some(t=>t.k===s)){document.documentElement.dataset.theme=s;setTh(s)}}catch(e){}
const on=()=>{let c="";NAV.forEach(n=>{const el=document.getElementById(id(n));if(el&&el.getBoundingClientRect().top<140)c=n});setAct(c);const h=document.documentElement;setPg(h.scrollTop/((h.scrollHeight-h.clientHeight)||1))};
addEventListener("scroll",on,{passive:true});return()=>removeEventListener("scroll",on)},[]);
const toggle=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("theme",r.dataset.theme)}catch(e){}};
const pick=k=>{document.documentElement.dataset.theme=k;setTh(k);setTm(false);try{localStorage.setItem("theme",k)}catch(e){}};
return html`<${React.Fragment}>
<header><div class="progress" style=${{transform:"scaleX("+pg+")"}}></div><div class="bar"><a class="logo" href="#top">Sohan Kale</a><nav class=${open?"open":""}>${NAV.map(n=>html`<a key=${n} onClick=${()=>setOpen(false)} href=${"#"+id(n)} class=${act===n?"on":""}>${n}</a>`)}</nav><button id="menu" aria-label="Menu" aria-expanded=${open} onClick=${()=>setOpen(!open)}>Menu</button><div class="tp"><button id="theme" aria-haspopup="true" aria-expanded=${tm} onClick=${()=>setTm(!tm)}>Theme</button>${tm&&html`<div class="tm" role="menu">${THEMES.map(t=>html`<button key=${t.k} role="menuitemradio" aria-checked=${th===t.k} onClick=${()=>pick(t.k)}><i style=${{background:t.c}}></i>${t.n}</button>`)}</div>`}</div></div></header>
<${Hero}/>
<main>
<section id="about"><h2>About</h2><p class="lead">I’m a Computer Science undergraduate who builds web apps in JavaScript and AI tools in Python. I completed two 3-month virtual internships with EduSkills (Full Stack Java and Google Developer), and I use AI coding assistants such as Claude and GitHub Copilot for development, debugging and test automation.</p>
<div class="stat"><div><b>6</b><span>Projects built</span></div><div><b>2</b><span>EduSkills internships</span></div><div><b>6</b><span>Certifications</span></div><div><b>2027</b><span>Expected graduation</span></div></div></section>
<${Skills}/><${Projects}/>
<section id="experience"><h2>Experience</h2><div class="tl">
<div class="card"><h3>Full Stack Java Developer Virtual Intern</h3><p class="meta">EduSkills · 3 months</p><p>Completed a 3-month virtual internship program in full stack Java development.</p></div>
<div class="card"><h3>Google Developer Virtual Intern</h3><p class="meta">EduSkills · 3 months</p><p>Completed a 3-month Google Developer virtual internship program offered through EduSkills.</p></div></div></section>
<section id="education"><h2>Education</h2><div class="card"><h3>B.E. in Computer Science and Engineering</h3><p class="meta">Takshashila Institute of Engineering and Technology, Darapur · Expected 2027</p>
<p style=${{marginBottom:0}}>${["Data Structures and Algorithms","Object-Oriented Programming","DBMS","Operating Systems","Computer Networks"].map(t=>html`<span class="tag" key=${t}>${t}</span>`)}</p></div></section>
<${Certs}/><${Contact}/>
</main>
<footer>© 2026 Sohan Kale</footer><//>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
